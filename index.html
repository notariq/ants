<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2ed" />
    <meta
      name="description"
      content="A small portfolio set inside a live ASCII ant colony."
    />
    <title>notariq</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          document.documentElement.dataset.theme = stored === "dark" ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <canvas id="colony" class="colony-canvas" aria-hidden="true"></canvas>

    <nav id="site-nav" class="site-nav" aria-label="Main" data-ants-avoid></nav>

    <main class="pointer-events-none relative z-10 h-dvh">
      <div id="view-home">
        <header class="hero" data-ants-avoid>
          <p id="tagline" class="tagline"></p>
          <h1 id="intro" class="intro">
            <span id="intro-full" class="sr-only"></span>
            <span id="intro-typed" aria-hidden="true"></span>
            <span class="caret" aria-hidden="true"></span>
          </h1>  
          <p id="socials" class="socials"></p>
        </header>
      </div>

      <div id="page-root" class="page-root" hidden></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
